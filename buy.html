<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสินค้า - PAMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-gray-800 p-8 rounded-2xl shadow-xl">
    <a href="index.html" class="text-yellow-400 hover:underline mb-6 inline-block">&larr; กลับหน้าสินค้า</a>
    
    <h2 class="text-2xl font-bold mb-6">กรอกข้อมูลสั่งซื้อ PAMA Hoodie</h2>

    <form id="orderForm" class="space-y-4">
      <div>
        <label class="block text-sm mb-1">เลือกสี:</label>
        <select id="color" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white">
          <option value="สีขาว">สีขาว</option>
          <option value="สีดำ">สีดำ</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">เลือกไซส์:</label>
        <select id="size" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white">
          <option value="S">S</option>
          <option value="M">M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>
      </div>

      <div>
        <label class="block text-sm mb-1">จำนวน (ตัว):</label>
        <input type="number" id="quantity" value="1" min="1" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white" onchange="updateTotal()">
      </div>

      <div>
        <label class="block text-sm mb-1">ชื่อ-นามสกุล:</label>
        <input type="text" id="name" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white">
      </div>

      <div>
        <label class="block text-sm mb-1">เบอร์โทรศัพท์:</label>
        <input type="tel" id="phone" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white">
      </div>

      <div>
        <label class="block text-sm mb-1">ที่อยู่จัดส่ง:</label>
        <textarea id="address" rows="3" required class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-white"></textarea>
      </div>

      <div class="text-xl font-bold text-yellow-400 py-2">
        ราคารวมทั้งสิ้น: <span id="totalPrice">790</span> บาท
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-bold py-3 rounded-lg transition">
        ยืนยันการสั่งซื้อ
      </button>
    </form>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycbx51kd1Af3dqTfcwMGK9c_h8QIFdMwv9A-rXKGFYwiJC2dEzj2R0EgYo7c8xMEBB5Q3/exec"; 

    function updateTotal() {
      const qty = document.getElementById('quantity').value;
      document.getElementById('totalPrice').innerText = qty * 790;
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "กำลังส่งข้อมูล...";

      const payload = {
        color: document.getElementById('color').value,
        size: document.getElementById('size').value,
        quantity: document.getElementById('quantity').value,
        name: document.getElementById('name').value,
        phone: document.getElementById('phone').value,
        address: document.getElementById('address').value,
        totalPrice: document.getElementById('quantity').value * 790
      };

      fetch(scriptURL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        alert("สั่งซื้อสำเร็จ! ขอบคุณที่อุดหนุน PAMA");
        window.location.href = "index.html";
      })
      .catch(err => {
        alert("สั่งซื้อสำเร็จ! ขอบคุณที่อุดหนุน PAMA");
        window.location.href = "index.html";
      });
    });
  </script>
</body>
</html>
